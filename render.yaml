services:
  # Worker Service - Telegram Bot (polling)
  # NOTE: For zero Telegram conflicts, keep exactly ONE worker instance running.
  - type: worker
    name: robovai-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: BLOGGER_BLOG_ID
        sync: false
      - key: BLOGGER_ACCESS_TOKEN
        sync: false
      - key: BLOGGER_REFRESH_TOKEN
        sync: false
      - key: BLOGGER_CLIENT_ID
        sync: false
      - key: BLOGGER_CLIENT_SECRET
        sync: false
      - key: DEVTO_API_KEY
        sync: false

      # Cloudflare R2 (recommended for cross-platform public image URLs)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_PREFIX
        sync: false

      # Optional fallback if you also run a static image server elsewhere
      - key: IMAGE_BASE_URL
        sync: false
