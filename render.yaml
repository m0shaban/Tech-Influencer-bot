services:
  # Combined Web Service - Bot + Dashboard + Image Server (all in one)
  - type: web
    name: robovai-creator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: IMAGE_BASE_URL
        value: https://robovai-creator.onrender.com
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: BLOGGER_BLOG_ID
        sync: false
      - key: BLOGGER_ACCESS_TOKEN
        sync: false
      - key: BLOGGER_REFRESH_TOKEN
        sync: false
      - key: BLOGGER_CLIENT_ID
        sync: false
      - key: BLOGGER_CLIENT_SECRET
        sync: false
      - key: DEVTO_API_KEY
