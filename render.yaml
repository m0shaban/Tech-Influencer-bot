services:
  # Web Service - Telegram Bot (polling) + Keep-Alive HTTP endpoint
  # NOTE: For zero Telegram conflicts, keep exactly ONE instance running.
  # Uses Flask health endpoint to prevent free-tier sleep.
  - type: web
    name: robovai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: BLOGGER_BLOG_ID
        sync: false
      - key: BLOGGER_ACCESS_TOKEN
        sync: false
      - key: BLOGGER_REFRESH_TOKEN
        sync: false
      - key: BLOGGER_CLIENT_ID
        sync: false
      - key: BLOGGER_CLIENT_SECRET
        sync: false
      - key: DEVTO_API_KEY
        sync: false

      # Storj (S3-compatible) for cross-platform public image URLs
      - key: STORJ_ACCESS_KEY_ID
        sync: false
      - key: STORJ_SECRET_ACCESS_KEY
        sync: false
      - key: STORJ_ENDPOINT_URL
        sync: false
      - key: STORJ_BUCKET
        sync: false
      - key: STORJ_PUBLIC_BASE_URL
        sync: false

      # Optional fallback (only if you run your own static image server)
      - key: IMAGE_BASE_URL
        sync: false
